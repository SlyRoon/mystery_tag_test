name: mystery-tag-test

x-app-environment: &app-environment
  APP_TIMEZONE: UTC
  DB_ROOT_PASSWORD: ""
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_QUEUE_CONNECTION: mysql
  DB_QUEUE_RETRY_AFTER: "${DB_QUEUE_RETRY_AFTER:-30}"
  QUEUE_CONNECTION: database
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis

x-app-service: &app-service
  build:
    context: .
    target: app
  image: mystery-tag-test-app:local
  env_file:
    - .env
  environment: *app-environment
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.4
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute='SELECT 1'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-partner:
    profiles: ["mock", "test"]
    build:
      context: .
      target: app
    image: mystery-tag-test-app:local
    command: ["php", "-S", "0.0.0.0:9000", "/var/www/app/docker/mock-partner.php"]
    environment:
      MOCK_PARTNER_STATUS: "${MOCK_PARTNER_STATUS:-200}"
      MOCK_PARTNER_DELAY_MS: "${MOCK_PARTNER_DELAY_MS:-0}"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$response = @file_get_contents('http://127.0.0.1:9000/health'); exit($$response === false ? 1 : 0);"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mysql-test:
    profiles: ["test"]
    image: mysql:8.4
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: mystery_tag_test_root_password
      MYSQL_DATABASE: mystery_tag_test
      MYSQL_USER: mystery_tag_test
      MYSQL_PASSWORD: mystery_tag_test_password
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute='SELECT 1'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis-test:
    profiles: ["test"]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: mystery-tag-test-test:local
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_DATABASE: mystery_tag_test
      DB_USERNAME: mystery_tag_test
      DB_PASSWORD: mystery_tag_test_password
      DB_QUEUE_CONNECTION: mysql
      DB_QUEUE_RETRY_AFTER: "30"
      QUEUE_CONNECTION: database
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis-test
      PARTNER_API_URL: http://mock-partner:9000/postback
      POSTBACK_INTEGRATION_TESTS: "1"
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mock-partner:
        condition: service_healthy
    command: ["php", "artisan", "test"]

  migrate:
    build:
      context: .
      target: app
    image: mystery-tag-test-app:local
    env_file:
      - .env
    environment: *app-environment
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *app-service
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$response = @file_get_contents('http://127.0.0.1:8000/up'); exit($$response === false ? 1 : 0);"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *app-service
    command:
      - php
      - artisan
      - queue:work
      - database
      - --sleep=1
      - --tries=1
      - --timeout=${WORKER_TIMEOUT:-15}
    restart: unless-stopped

  scheduler:
    <<: *app-service
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

volumes:
  mysql-data:
